name: Deploy page to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The page is built locally, so the tag must match the version baked into index.html.
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$package" ]; then
            echo "Tag v$tag does not match package.json version $package." >&2
            echo "Run 'npm run release' locally instead of tagging by hand." >&2
            exit 1
          fi

      # Only the encrypted index.html is published; the sources stay unpublished.
      - name: Collect the published file
        run: |
          mkdir _site
          cp index.html _site/index.html
          [ -f CNAME ] && cp CNAME _site/CNAME || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
